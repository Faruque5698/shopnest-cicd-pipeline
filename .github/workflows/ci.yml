name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel outdated PR runs automatically, but never cancel main branch runs
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fixed YAML indentation and syntax (Part H)
  security-hygiene:
    name: Security Hygiene Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no secret files or private keys are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.(?!example))|\.(pem|key|ppk)$|id_(rsa|ed25519)$'; then
            echo "::error::Sensitive file detected in git tracking!"
            exit 1
          fi
          echo "Security hygiene check passed: no .env or private key files tracked."

  backend:
    name: Backend CI (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Lint backend code
        run: npm run lint

      - name: Run backend automated tests
        run: npm test

      - name: Build backend distribution
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Upload backend build artifact (Node ${{ matrix.node-version }})
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-node-${{ matrix.node-version }}
          path: backend/dist/
          retention-days: 7
          if-no-files-found: error

  frontend:
    name: Frontend CI (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend code
        run: npm run lint

      - name: Run frontend automated tests
        run: npm test

      - name: Build frontend production bundle
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error

  verify:
    name: Verify Build Artifacts
    runs-on: ubuntu-latest
    needs: [security-hygiene, backend, frontend]
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Validate backend and frontend build outputs
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Verify Node 20 and Node 22 backend artifacts
          for ver in 20 22; do
            dir="artifacts/backend-build-node-${ver}"
            test -f "${dir}/src/server.js"
            test -f "${dir}/package.json"
            test -f "${dir}/build-info.json"
            actual_sha=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${dir}/build-info.json','utf8')).commitSha)")
            if [ "${actual_sha}" != "${EXPECTED_SHA}" ]; then
              echo "::error::Commit SHA mismatch in ${dir}: expected ${EXPECTED_SHA}, got ${actual_sha}"
              exit 1
            fi
            echo "Verified ${dir} (commit: ${actual_sha})"
          done

          # Verify frontend production bundle
          test -f "artifacts/frontend-build/index.html"
          test -d "artifacts/frontend-build/assets"
          echo "Verified artifacts/frontend-build (index.html + assets present)"

      - name: Write CI verification summary
        run: |
          {
            echo "### ShopNest CI Verification Passed"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **Backend Matrix:** Node.js 20 & Node.js 22 (lint, 9 tests, build verified)"
            echo "- **Frontend:** Node.js 20 (lint, 6 tests, Vite bundle verified)"
            echo "- **Security Hygiene:** No secrets or private key files tracked"
          } >> "$GITHUB_STEP_SUMMARY"
