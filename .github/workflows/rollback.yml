name: Manual Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to roll back"
        type: choice
        required: true
        default: "production"
        options:
          - production
          - staging
      target_sha:
        description: "Exact earlier Git commit SHA to restore (7+ char or full SHA)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  package-rollback:
    name: Build Target Earlier Release
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout latest deploy script from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-scripts

      - name: Checkout repository with full history for target commit (${{ inputs.target_sha }})
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target-app

      - name: Checkout target commit and resolve full SHA
        id: meta
        working-directory: target-app
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          git checkout "${TARGET_SHA}"
          FULL_SHA="$(git rev-parse HEAD)"
          echo "commit_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "Preparing manual rollback to commit: ${FULL_SHA}"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build target backend
        working-directory: target-app/backend
        env:
          GIT_COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
        run: |
          npm ci
          npm run build

      - name: Build target frontend
        working-directory: target-app/frontend
        run: |
          npm ci
          npm run build

      - name: Package rollback archive
        run: |
          mkdir -p rollback-stage/frontend rollback-stage/backend rollback-stage/database rollback-stage/scripts
          cp -r target-app/frontend/dist/. rollback-stage/frontend/
          cp -r target-app/backend/dist/. rollback-stage/backend/
          cp -r target-app/database/. rollback-stage/database/
          cp main-scripts/scripts/deploy-blue-green.sh rollback-stage/scripts/
          chmod +x rollback-stage/scripts/deploy-blue-green.sh
          tar -czf "rollback-${{ steps.meta.outputs.commit_sha }}.tar.gz" -C rollback-stage frontend backend database scripts

      - name: Upload rollback archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopnest-rollback-${{ steps.meta.outputs.short_sha }}
          path: rollback-${{ steps.meta.outputs.commit_sha }}.tar.gz
          retention-days: 14
          if-no-files-found: error

  execute-rollback:
    name: Execute Zero-Downtime Rollback (${{ inputs.environment }})
    needs: [package-rollback]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Download rollback archive
        uses: actions/download-artifact@v4
        with:
          name: shopnest-rollback-${{ needs.package-rollback.outputs.short_sha }}

      - name: Configure SSH private key securely
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Roll back target environment with zero downtime
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_ENV: ${{ vars.APP_ENV }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_SSL: ${{ vars.DB_SSL }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          NGINX_SLOT_FILE: ${{ vars.NGINX_SLOT_FILE }}
          BLUE_PORT: ${{ vars.BLUE_PORT }}
          GREEN_PORT: ${{ vars.GREEN_PORT }}
          PUBLIC_PORT: ${{ vars.PUBLIC_PORT }}
          COMMIT_SHA: ${{ needs.package-rollback.outputs.commit_sha }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key"
          ARCHIVE="rollback-${COMMIT_SHA}.tar.gz"
          scp ${SSH_OPTS} "${ARCHIVE}" "${EC2_USER}@${EC2_HOST}:/tmp/${ARCHIVE}"

          ssh ${SSH_OPTS} "${EC2_USER}@${EC2_HOST}" "mkdir -p '${DEPLOY_ROOT}' && umask 077 && cat > '${DEPLOY_ROOT}/.env'" <<EOF
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_SSL=${DB_SSL}
          EOF

          ssh ${SSH_OPTS} "${EC2_USER}@${EC2_HOST}" \
            "tar -xzf '/tmp/${ARCHIVE}' -C /tmp scripts/deploy-blue-green.sh && chmod +x /tmp/scripts/deploy-blue-green.sh && \
            APP_ENV='${APP_ENV}' \
            DEPLOY_ROOT='${DEPLOY_ROOT}' \
            NGINX_SLOT_FILE='${NGINX_SLOT_FILE}' \
            GIT_COMMIT_SHA='${COMMIT_SHA}' \
            BLUE_PORT='${BLUE_PORT}' \
            GREEN_PORT='${GREEN_PORT}' \
            PUBLIC_PORT='${PUBLIC_PORT}' \
            RELEASE_ARCHIVE='/tmp/${ARCHIVE}' \
            /tmp/scripts/deploy-blue-green.sh && \
            rm -f '/tmp/${ARCHIVE}'" 2>&1 | tee rollback.log

      - name: Upload rollback log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-log-${{ inputs.environment }}-${{ needs.package-rollback.outputs.short_sha }}
          path: rollback.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Write manual rollback summary
        if: always()
        run: |
          {
            echo "### Manual Rollback Summary"
            echo "- **Environment:** \`${{ inputs.environment }}\`"
            echo "- **Restored Commit SHA:** \`${{ needs.package-rollback.outputs.commit_sha }}\`"
            echo "- **Outcome:** \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
